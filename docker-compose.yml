services:
  # MongoDB Database Service
  mongo:
    image: mongo:6-jammy
    container_name: smartprice-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # SmartPrice Express Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartprice-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/smartprice
      - JWT_SECRET=smartprice_production_secret_key_change_in_prod
      - JWT_EXPIRE=30d
      - NODE_ENV=production
    depends_on:
      - mongo
    volumes:
      - backend_uploads:/app/uploads

volumes:
  mongo_data:
  backend_uploads:
